<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقديم شخصية - SHADOW TOWN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f13;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1a1a24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid #2a2a3a;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #7289da;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #b9bbbe;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #23272a;
            background-color: #2c2f33;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            border-color: #7289da;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #7289da;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #5b6eae;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .status.success {
            color: #43b581;
        }

        .status.error {
            color: #f04747;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>تقديم شخصية SHADOW TOWN</h2>
    <form id="characterForm">
        <div class="form-group">
            <label for="charName">اسم الشخصية:</label>
            <input type="text" id="charName" required placeholder="أدخل اسم الشخصية بالكامل">
        </div>

        <div class="form-group">
            <label for="charAge">عمر الشخصية:</label>
            <input type="number" id="charAge" required placeholder="مثال: 25">
        </div>

        <div class="form-group">
            <label for="charCountry">بلد الشخصية:</label>
            <input type="text" id="charCountry" required placeholder="أدخل دولة الشخصية">
        </div>

        <div class="form-group">
            <label for="charDesc">وصف الشخصية:</label>
            <textarea id="charDesc" required placeholder="اكتب المظهر الخارجي، الصفات، والسلوكيات..."></textarea>
        </div>

        <div class="form-group">
            <label for="charStory">قصة الشخصية:</label>
            <textarea id="charStory" required placeholder="اكتب خلفية الشخصية وقصتها السابقة..."></textarea>
        </div>

        <button type="submit" id="submitBtn">إرسال التقديم</button>
    </form>
    <div id="statusMessage" class="status"></div>
</div>

<script>
    const webhookUrl = "https://discord.com/api/webhooks/1548432225773559949/MmBkkszEJ-gTxi9cs6Hb_GJSQLBtwibV1TL1Ob3tMt3m7QMaRUkhUnAZHzw6wd4YH6Jj";

    document.getElementById('characterForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        submitBtn.disabled = true;
        submitBtn.innerText = "جاري الإرسال...";
        statusMessage.style.display = "none";

        // تجميع البيانات
        const charName = document.getElementById('charName').value;
        const charAge = document.getElementById('charAge').value;
        const charCountry = document.getElementById('charCountry').value;
        const charDesc = document.getElementById('charDesc').value;
        const charStory = document.getElementById('charStory').value;

        // إعداد رسالة الديسكورد (Embed)
        const payload = {
            username: "SHADOW TOWN - Bot",
            embeds: [
                {
                    title: "📝 تقديم شخصية جديدة",
                    color: 3447003, // لون أزرق مائل للبنفسجي
                    fields: [
                        { name: "👤 اسم الشخصية", value: charName, inline: true },
                        { name: "🎂 العمر", value: charAge, inline: true },
                        { name: "🌍 البلد", value: charCountry, inline: true },
                        { name: "📌 وصف الشخصية", value: charDesc, inline: false },
                        { name: "📖 قصة الشخصية", value: charStory, inline: false }
                    ],
                    footer: {
                        text: "SHADOW TOWN Roleplay System"
                    },
                    timestamp: new Date()
                }
            ]
        };

        // إرسال طلب إلى Webhook
        fetch(webhookUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
        })
        .then(response => {
            if (response.ok) {
                statusMessage.className = "status success";
                statusMessage.innerText = "تم إرسال التقديم بنجاح!";
                document.getElementById('characterForm').reset();
            } else {
                throw new Error('فشل الإرسال');
            }
        })
        .catch(error => {
            statusMessage.className = "status error";
            statusMessage.innerText = "حدث خطأ أثناء الإرسال، حاول مرة أخرى.";
            console.error('Error:', error);
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "إرسال التقديم";
            statusMessage.style.display = "block";
        });
    });
</script>

</body>
</html>
